controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    # Declare the controllers that the manager will load
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    iiwa_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters: {}

iiwa_arm_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7

    # Specify the command interface matching your ros2_control tags
    command_interfaces:
      - position

    # State interfaces provided by the MuJoCo system interface
    state_interfaces:
      - position
      - velocity

    # # Optional: Allow the controller to fall back to a stop state if goals aren't met
    # state_publish_rate: 50.0
    # action_monitor_rate: 20.0
    # allow_partial_joints_goal: false
    # open_loop_control: false

    # # Optional: Basic constraints for trajectory execution tracking
    # constraints:
    #   stopped_velocity_tolerance: 0.01
    #   goal_time: 0.0
